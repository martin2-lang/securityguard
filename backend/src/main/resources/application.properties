# ── SERVER ──
server.port=8080

# ── MONGODB ──
spring.data.mongodb.uri=mongodb://localhost:27017/securityguard
spring.data.mongodb.database=securityguard

# ── LOGGING ──
logging.level.com.securityguard=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# ── CORS ── (handled in Java config)
spring.web.cors.allowed-origins=http://localhost:5173

# ── APP INFO ──
spring.application.name=SecurityGuard

# ── JWT ──
# En producción definir la variable de entorno JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:securityguard-clave-secreta-cambiar-en-produccion-2026}
jwt.expiration-ms=3600000
